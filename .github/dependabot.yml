version: 2

updates:
  # =====================================
  # Frontend (npm)
  # - minor / patch は grouped
  # - major は group に入れず個別 PR
  # =====================================
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Tokyo"
    groups:
      frontend-production-non-major:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      frontend-development-non-major:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "frontend"

  # =====================================
  # Backend (npm)
  # - minor / patch は grouped
  # - major は group に入れず個別 PR
  # =====================================
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Tokyo"
    groups:
      backend-production-non-major:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      backend-development-non-major:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "backend"

  # =====================================
  # GitHub Actions
  # - minor / patch は grouped
  # - major は group に入れず個別 PR
  # =====================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Tokyo"
    groups:
      github-actions-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"
      - "other"
