openapi: 3.0.3
info:
  title: Health Checker Alert API
  description: |
    Health Checker system Alert management API specification
    
    ## Overview
    This API provides functionality to manage alerts and health checks in the Health Checker system.
    
    ## Authentication
    Currently accessible without authentication.
    
    ## Rate Limiting
    - Alert execution operations may have rate limits
    - GitHub API rate limits apply for repository checks
    
    ## Error Responses
    All error responses are returned in the following format:
    ```json
    {
      "success": false,
      "error": {
        "code": "ERROR_CODE",
        "message": "Error message"
      }
    }
    ```
  version: 1.0.0
  contact:
    name: Health Checker Team
    email: support@health-checker.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3001/api
    description: Development environment
  - url: https://api.health-checker.com/api
    description: Production environment

paths:
  /alerts/by-author:
    get:
      tags:
        - Alert
      summary: Get alerts by author
      description: |
        Retrieve alerts grouped by author for analysis and reporting.
        
        ## Use Cases
        - Author-based alert analysis
        - Developer productivity insights
        - Alert distribution by contributor
      operationId: getAlertsByAuthor
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of results to return
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          example: 100
        - name: offset
          in: query
          required: false
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthorAlertGroup'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/authors/{author}:
    get:
      tags:
        - Alert
      summary: Get alerts by specific author
      description: |
        Retrieve all alerts for a specific author.
      operationId: getAlertsBySpecificAuthor
      parameters:
        - $ref: '#/components/parameters/Author'
      responses:
        '200':
          description: Author alerts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      author:
                        type: string
                        example: "octocat"
                      alerts:
                        type: array
                        items:
                          $ref: '#/components/schemas/Alert'
                      totalCount:
                        type: integer
                        example: 15
        '404':
          description: Author not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/backfill-authors:
    post:
      tags:
        - Alert
      summary: Backfill author information
      description: |
        Backfill author information for existing alerts that may be missing author data.
        
        ## Process
        1. Scans existing alerts for missing author information
        2. Attempts to retrieve author information from GitHub
        3. Updates alert records with author data
        4. Returns summary of processed alerts
      operationId: backfillAuthors
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
                  description: Maximum number of alerts to process
                dryRun:
                  type: boolean
                  default: false
                  description: If true, only analyze without making changes
              examples:
                default:
                  summary: Default backfill
                  value: {}
                limited:
                  summary: Limited backfill
                  value:
                    limit: 50
                dry_run:
                  summary: Dry run
                  value:
                    limit: 100
                    dryRun: true
      responses:
        '200':
          description: Author backfill completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Author backfill completed successfully"
                  data:
                    type: object
                    properties:
                      processedCount:
                        type: integer
                        example: 25
                      updatedCount:
                        type: integer
                        example: 20
                      skippedCount:
                        type: integer
                        example: 5
                      dryRun:
                        type: boolean
                        example: false
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/check/{owner}:
    post:
      tags:
        - Alert
      summary: Check stored repositories
      description: |
        Execute health checks for all stored repositories belonging to the specified owner.
        
        ## Process
        1. Retrieves all repositories for the owner from database
        2. Executes health checks for each repository
        3. Updates alert records with latest results
        4. Returns summary of check results
      operationId: checkStoredRepos
      parameters:
        - $ref: '#/components/parameters/Owner'
      responses:
        '200':
          description: Repository checks completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Repository checks completed successfully"
                  data:
                    type: object
                    properties:
                      owner:
                        type: string
                        example: "octocat"
                      checkedRepos:
                        type: integer
                        example: 5
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/CheckResult'
        '400':
          description: Invalid owner parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/check/{owner}/{repo}:
    post:
      tags:
        - Alert
      summary: Run manual alert check
      description: |
        Execute manual health check for a specific repository.
        
        ## Check Types
        - branch: Branch status check
        - clone: Repository clone verification
        - gitleaks: Sensitive information detection
        - issue: Issue status check
        - actions: GitHub Actions status check
        - audit: Security audit
      operationId: runManualAlert
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                checkTypes:
                  type: array
                  items:
                    type: string
                    enum:
                      - branch
                      - clone
                      - gitleaks
                      - issue
                      - actions
                      - audit
                  description: Specific check types to execute (all if not specified)
                  example: ["branch", "clone", "gitleaks"]
            examples:
              all_checks:
                summary: Execute all checks
                value:
                  checkTypes: ["branch", "clone", "gitleaks", "issue", "actions", "audit"]
              specific_checks:
                summary: Execute specific checks
                value:
                  checkTypes: ["branch", "issue"]
              default:
                summary: Default (all checks)
                value: {}
      responses:
        '200':
          description: Manual alert check completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Manual alert check completed successfully"
                  data:
                    $ref: '#/components/schemas/CheckResult'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/summary:
    post:
      tags:
        - Alert
      summary: Get alert summary
      description: |
        Get severity-based summary of alerts for specified repositories.
      operationId: getSummary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoList'
            examples:
              single_repo:
                summary: Single repository
                value:
                  - owner: "octocat"
                    repo: "Hello-World"
              multiple_repos:
                summary: Multiple repositories
                value:
                  - owner: "octocat"
                    repo: "Hello-World"
                  - owner: "octocat"
                    repo: "Spoon-Knife"
      responses:
        '200':
          description: Alert summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AlertSummary'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/summary-by-checktype:
    post:
      tags:
        - Alert
      summary: Get check type summary
      description: |
        Get summary of alerts grouped by check type for specified repositories.
      operationId: getCheckTypeSummary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoList'
      responses:
        '200':
          description: Check type summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CheckTypeSummary'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /alerts/{owner}/{repo}:
    get:
      tags:
        - Alert
      summary: List repository alerts
      description: |
        Get all alerts for a specific repository.
      operationId: listRepoAlerts
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
        - name: limit
          in: query
          required: false
          description: Number of alerts to return
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          example: 100
        - name: offset
          in: query
          required: false
          description: Number of alerts to skip
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Repository alerts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      owner:
                        type: string
                        example: "octocat"
                      repo:
                        type: string
                        example: "Hello-World"
                      alerts:
                        type: array
                        items:
                          $ref: '#/components/schemas/Alert'
                      totalCount:
                        type: integer
                        example: 25
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Alert:
      type: object
      required:
        - id
        - owner
        - repo
        - checkType
        - severity
        - status
        - message
        - detectedAt
        - createdAt
      properties:
        id:
          type: integer
          description: Unique alert identifier
          example: 1
        owner:
          type: string
          description: Repository owner
          example: "octocat"
        repo:
          type: string
          description: Repository name
          example: "Hello-World"
        checkType:
          type: string
          enum:
            - branch
            - clone
            - gitleaks
            - issue
            - actions
            - audit
          description: Type of health check
          example: "gitleaks"
        severity:
          type: string
          enum:
            - critical
            - high
            - medium
            - low
            - info
          description: Alert severity level
          example: "high"
        status:
          type: string
          enum:
            - active
            - resolved
            - ignored
          description: Alert status
          example: "active"
        message:
          type: string
          description: Alert message
          example: "Sensitive information detected in repository"
        details:
          type: object
          description: Additional alert details
          example:
            file: "config/database.yml"
            line: 5
            pattern: "password"
        author:
          type: string
          description: Author of the code that triggered the alert
          example: "octocat"
        detectedAt:
          type: string
          format: date-time
          description: When the alert was first detected
          example: "2023-09-19T12:34:56.789Z"
        resolvedAt:
          type: string
          format: date-time
          description: When the alert was resolved
          example: "2023-09-20T10:15:30.123Z"
        createdAt:
          type: string
          format: date-time
          description: Alert creation timestamp
          example: "2023-09-19T12:34:56.789Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2023-09-19T12:34:56.789Z"

    AuthorAlertGroup:
      type: object
      required:
        - author
        - alertCount
        - alerts
      properties:
        author:
          type: string
          description: Author name
          example: "octocat"
        alertCount:
          type: integer
          description: Total number of alerts for this author
          example: 15
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        severityBreakdown:
          type: object
          properties:
            critical:
              type: integer
              example: 2
            high:
              type: integer
              example: 5
            medium:
              type: integer
              example: 6
            low:
              type: integer
              example: 2
            info:
              type: integer
              example: 0

    AlertSummary:
      type: object
      required:
        - totalAlerts
        - severityBreakdown
        - repositories
      properties:
        totalAlerts:
          type: integer
          description: Total number of alerts
          example: 50
        severityBreakdown:
          type: object
          properties:
            critical:
              type: integer
              example: 5
            high:
              type: integer
              example: 15
            medium:
              type: integer
              example: 20
            low:
              type: integer
              example: 8
            info:
              type: integer
              example: 2
        repositories:
          type: array
          items:
            type: object
            properties:
              owner:
                type: string
                example: "octocat"
              repo:
                type: string
                example: "Hello-World"
              alertCount:
                type: integer
                example: 10
              severityBreakdown:
                type: object
                properties:
                  critical:
                    type: integer
                    example: 1
                  high:
                    type: integer
                    example: 3
                  medium:
                    type: integer
                    example: 4
                  low:
                    type: integer
                    example: 2
                  info:
                    type: integer
                    example: 0

    CheckTypeSummary:
      type: object
      required:
        - checkTypes
        - totalAlerts
      properties:
        totalAlerts:
          type: integer
          description: Total number of alerts across all check types
          example: 50
        checkTypes:
          type: array
          items:
            type: object
            properties:
              checkType:
                type: string
                enum:
                  - branch
                  - clone
                  - gitleaks
                  - issue
                  - actions
                  - audit
                example: "gitleaks"
              alertCount:
                type: integer
                description: Number of alerts for this check type
                example: 15
              severityBreakdown:
                type: object
                properties:
                  critical:
                    type: integer
                    example: 2
                  high:
                    type: integer
                    example: 8
                  medium:
                    type: integer
                    example: 4
                  low:
                    type: integer
                    example: 1
                  info:
                    type: integer
                    example: 0

    RepoList:
      type: array
      items:
        type: object
        required:
          - owner
          - repo
        properties:
          owner:
            type: string
            description: GitHub repository owner
            example: "octocat"
          repo:
            type: string
            description: Repository name
            example: "Hello-World"

    CheckResult:
      type: object
      required:
        - owner
        - repo
        - checkType
        - status
        - executedAt
      properties:
        owner:
          type: string
          example: "octocat"
        repo:
          type: string
          example: "Hello-World"
        checkType:
          type: string
          enum:
            - branch
            - clone
            - gitleaks
            - issue
            - actions
            - audit
          example: "gitleaks"
        status:
          type: string
          enum:
            - success
            - failure
            - error
          example: "success"
        message:
          type: string
          description: Check result message
          example: "No sensitive information detected"
        alertsFound:
          type: integer
          description: Number of alerts found during check
          example: 0
        executedAt:
          type: string
          format: date-time
          description: Check execution timestamp
          example: "2023-09-19T12:34:56.789Z"
        durationMs:
          type: integer
          description: Check execution time in milliseconds
          example: 1500

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Error code
              example: "REPOSITORY_NOT_FOUND"
            message:
              type: string
              description: Human-readable error message
              example: "Repository 'octocat/Hello-World' not found"

  parameters:
    Owner:
      name: owner
      in: path
      required: true
      description: GitHub repository owner name
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-_]+$'
      example: "octocat"

    Repo:
      name: repo
      in: path
      required: true
      description: GitHub repository name
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-_]+$'
      example: "Hello-World"

    Author:
      name: author
      in: path
      required: true
      description: Author name
      schema:
        type: string
      example: "octocat"

tags:
  - name: Alert
    description: Alert management and health check operations
